x-common-env: &common-env
  FLASK_APP: playerApp.py
  FLASK_CONFIG: production
  DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  CELERY_BROKER_URL: amqp://${RABBIT_USERNAME}:${RABBIT_USER_PASSWORD}@rabbit:5672/
  CELERY_RESULT_BACKEND: db+postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  VIDEO_SOURCE: ${VIDEO_SOURCE}
  AUDIO_SOURCE: ${AUDIO_SOURCE}
  SECRET_KEY: ${SECRET_KEY}
  WHIP_ENDPOINT: http://mediamtx:8889/stream/whip
  FLOWER_PORT: ${FLOWER_PORT}
  FLASK_PORT: ${FLASK_PORT}

x-app-base: &app-base
  build:
    context: ./StreamerApp
    dockerfile: ./docker/prod/Dockerfile
  environment: *common-env
  devices:
    - /dev/:/dev/
    - /dev/snb:/dev/snb
  volumes:
    - /lib/modules:/lib/modules
  group_add:
    - video
    - audio
  privileged: true
  depends_on:
    - postgres
    - mediamtx
  networks:
    - webrtc-network
    - proxy-server
    - database
    - messages

services:
  web:
    <<: *app-base
    command: /start.sh

  worker:
    <<: *app-base
    command: /worker.sh

  flower:
    <<: *app-base
    command: /flower.sh
    ports:
      - ${FLOWER_PORT}:${FLOWER_PORT}

  nginx:
    build:
      context: ./nginx
    ports:
      - 80:80
    depends_on:
      - web
      - mediamtx
    networks:
      - proxy-server
      - webrtc-network

  mediamtx:
    image: bluenviron/mediamtx:latest
    ports:
      - 8889:8889  # WHIP/WHEP HTTP port
      - 8189:8189/udp  # WebRTC UDP
    environment:
      - MTX_WEBRTCADDITIONALHOSTS=192.168.4.25  # Your odroid IP - update this!
    volumes:
      - ./mediamtx.yml:/mediamtx.yml
    networks:
      - webrtc-network

  postgres:
    image: postgres:13
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - ./postgres-data/postgres:/var/lib/postgresql/data
    networks:
      - database

  rabbit:
    build: ./rabbit
    environment:
      - RABBIT_USERNAME=${RABBIT_USERNAME}
      - RABBIT_USER_PASSWORD=${RABBIT_USER_PASSWORD}
    networks:
      - messages
      - database

networks:
  webrtc-network:
    driver: bridge
  database:
    driver: bridge
  proxy-server:
    driver: bridge
  messages:
    driver: bridge
